<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البرنامج العالمي لضرب الاستبيانات</title>

    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS for Excel generation and parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Custom scrollbar for drag-and-drop areas */
        .drag-over {
            border: 2px dashed #3b82f6 !important;
            background-color: #eff6ff !important;
        }
        /* Hide number input arrows for cleaner look */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .hover-zoom {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .hover-zoom:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .thin-title {
            font-weight: 300;
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body class="bg-blue-100 min-h-screen pb-20">
    <div id="root"></div>

    <!-- Personalized Footer -->
    <footer class="fixed bottom-0 left-0 w-full bg-gray-900 text-white text-center py-2 z-50 shadow-lg">
        <p class="text-sm md:text-base font-light tracking-wide uppercase">
            All rights are reserved to Dr. Mazen Badawy – Doctorate of English Teaching & Testing
        </p>
    </footer>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* --- Initial Data Structure (Starts Empty as requested) --- */
        const initialScales = [
            { id: 's1', name: 'اوافق تمام', type: 'positive' },
            { id: 's2', name: 'اوافق', type: 'positive' },
            { id: 's3', name: 'اوافق الي حد ما', type: 'positive' },
            { id: 's4', name: 'لا اوافق', type: 'negative' },
            { id: 's5', name: 'لا اوافق مطلقا', type: 'negative' }
        ];

        /* Domains start completely empty */
        const initialDomains = [];

        function App() {
            const [scales, setScales] = useState(initialScales);
            const [domains, setDomains] = useState(initialDomains);

            /* Modal State for avoiding native alerts/confirms */
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null, inputType: 'number' });

            /* Drag and drop state for items */
            const [draggedItem, setDraggedItem] = useState(null);
            const [draggedOverItem, setDraggedOverItem] = useState(null);

            /* Drag and drop state for scales (columns) */
            const [draggedScaleIndex, setDraggedScaleIndex] = useState(null);
            const [draggedOverScaleIndex, setDraggedOverScaleIndex] = useState(null);

            /* Number of participants (Default to 100 to prevent percentage fractional drift in mock data) */
            const [participantsCount, setParticipantsCount] = useState(100);

            /* Temp state for prompt modal */
            const [tempPromptValue, setTempPromptValue] = useState(88);

            /* Base file name state for exports */
            const [originalFileName, setOriginalFileName] = useState('Questionnaire');

            /* --- Custom Modal Helpers --- */
            const showAlert = (message) => setModalConfig({ isOpen: true, type: 'alert', message, onConfirm: null, inputType: 'number' });
            const showConfirm = (message, onConfirm) => setModalConfig({ isOpen: true, type: 'confirm', message, onConfirm, inputType: 'number' });
            const showPrompt = (message, defaultValue, onConfirm, inputType = 'number') => {
                setTempPromptValue(defaultValue);
                setModalConfig({ isOpen: true, type: 'prompt', message, onConfirm, inputType });
            };
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false });

            /* --- Handlers for Auto Fill (Smart Percentage Generator) --- */
            const handleAutoFill = () => {
                if (domains.length === 0) {
                    showAlert('لا توجد محاور أو بنود لتعبئتها. يرجى إضافة محاور أولاً أو رفع ملف.');
                    return;
                }

                showPrompt('الرجاء إدخال المتوسط العام للإيجابيات المطلوب (%) لتوليد النسب بناءً عليه:', 88, (targetValue) => {
                    executeAutoFill(Number(targetValue));
                }, 'number');
            };

            const executeAutoFill = (targetPositiveAverage) => {
                const totalItemsCount = domains.reduce((count, domain) => count + domain.items.length, 0);
                if (totalItemsCount === 0) return;

                const posScales = scales.filter(s => s.type === 'positive');
                const negScales = scales.filter(s => s.type === 'negative');
                const neuScales = scales.filter(s => s.type === 'neutral');

                /* Pre-calculate exact positive budgets to hit the target average */
                let posBudgets = [];
                const targetSum = Math.round(targetPositiveAverage * totalItemsCount);

                for (let i = 0; i < totalItemsCount; i++) {
                    let val = targetPositiveAverage + Math.floor(Math.random() * 11) - 5; /* +/- 5 fluctuation */
                    val = Math.max(0, Math.min(100, val));
                    posBudgets.push(val);
                }

                let currentSum = posBudgets.reduce((a, b) => a + b, 0);
                let diff = targetSum - currentSum;

                /* Balance the array to hit the exact sum */
                let attempts = 0;
                while (diff !== 0 && attempts < 10000) {
                    let idx = Math.floor(Math.random() * totalItemsCount);
                    if (diff > 0 && posBudgets[idx] < 100) {
                        posBudgets[idx]++;
                        diff--;
                    } else if (diff < 0 && posBudgets[idx] > 0) {
                        posBudgets[idx]--;
                        diff++;
                    }
                    attempts++;
                }

                let budgetIndex = 0;

                /* Immediate execution: No confirm needed to keep it fast and responsive */
                setDomains(prevDomains => prevDomains.map(domain => {
                    const newItems = domain.items.map(item => {
                        let posBudget = posScales.length > 0 ? posBudgets[budgetIndex++] : 0;
                        let remainingBudget = 100 - posBudget;

                        let negBudget = 0;
                        let neuBudget = 0;

                        if (negScales.length > 0 && neuScales.length > 0) {
                            /* Randomly assign a small portion to negative, rest to neutral */
                            negBudget = Math.floor(Math.random() * Math.min(15, remainingBudget + 1));
                            neuBudget = remainingBudget - negBudget;
                        } else if (negScales.length > 0) {
                            negBudget = remainingBudget;
                        } else if (neuScales.length > 0) {
                            neuBudget = remainingBudget;
                        }

                        const newValues = { ...item.values };

                        /* Distribute function across multiple scales of the same type if they exist */
                        const distribute = (budget, scalesArray) => {
                            if (scalesArray.length === 0) return;
                            if (scalesArray.length === 1) {
                                newValues[scalesArray[0].id] = budget;
                                return;
                            }
                            let remaining = budget;
                            scalesArray.forEach((s, index) => {
                                if (index === scalesArray.length - 1) {
                                    newValues[s.id] = remaining;
                                } else {
                                    const alloc = Math.floor(Math.random() * (remaining / 2)) + Math.floor(remaining / scalesArray.length);
                                    const finalAlloc = Math.min(alloc, remaining);
                                    newValues[s.id] = finalAlloc;
                                    remaining -= finalAlloc;
                                }
                            });
                        };

                        distribute(posBudget, posScales);                        distribute(negBudget, negScales);                        distribute(neuBudget, neuScales);

                        return { ...item, values: newValues };
                    });
                    return { ...domain, items: newItems };
                }));
            };

            /* --- Handlers for Excel Upload --- */
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                /* Save file name without extension for later export */
                const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
                setOriginalFileName(fileNameWithoutExt);

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataArray = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(dataArray, { type: 'array' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        if (data.length < 2) {
                            showAlert('الملف المرفوع فارغ أو لا يحتوي على بيانات صحيحة.');
                            return;
                        }

                        /* 1. Parse Headers (Scales) */
                        const headers = data[0];
                        /* Support for both 'المحور' and 'المجال' for backward compatibility */
                        const domainIdx = headers.indexOf('المحور') !== -1 ? headers.indexOf('المحور') : (headers.indexOf('المجال') !== -1 ? headers.indexOf('المجال') : 0);
                        const itemIdx = headers.indexOf('البنود') !== -1 ? headers.indexOf('البنود') : 1;
                        const totalIdx = headers.indexOf('المجموع') !== -1 ? headers.indexOf('المجموع') : headers.indexOf('إجمالي الصف (%)');
                        const endScaleIdx = totalIdx !== -1 ? totalIdx : headers.length;
                        const scaleNames = headers.slice(itemIdx + 1, endScaleIdx);

                        const newScales = scaleNames.map((name, idx) => ({
                            id: `import_s_${idx}_${Date.now()}`,
                            name: name || `مقياس ${idx + 1}`,
                            type: idx === 0 ? 'positive' : (idx === scaleNames.length - 1 ? 'negative' : 'neutral')
                        }));

                        /* 2. Parse Domains and Items */
                        const newDomainsMap = new Map();

                        for (let i = 1; i < data.length; i++) {
                            const row = data[i];
                            if (!row || row.length === 0 || !row[domainIdx]) continue;

                            const domainName = row[domainIdx];
                            const itemText = row[itemIdx] || 'بند بدون نص';

                            /* تخطي صفوف العناوين المكررة وصفوف المجاميع عند إعادة الرفع */
                            if (domainName === 'المحور' || domainName === 'المجال' || (typeof domainName === 'string' && domainName.includes('متوسط إيجابيات'))) continue;

                            if (!newDomainsMap.has(domainName)) {
                                newDomainsMap.set(domainName, {
                                    id: `import_d_${newDomainsMap.size}_${Date.now()}`,
                                    name: domainName,
                                    items: []
                                });
                            }

                            const domainObj = newDomainsMap.get(domainName);
                            const itemValues = {};
                            newScales.forEach((scale, idx) => {
                                const cellVal = row[itemIdx + 1 + idx];
                                let numVal = 0;
                                if (cellVal !== undefined && cellVal !== null && cellVal !== '') {
                                    if (typeof cellVal === 'string') {
                                        numVal = Number(cellVal.replace('%', '').trim());
                                    } else {
                                        numVal = Number(cellVal);
                                    }
                                } else {
                                    numVal = '';
                                }
                                itemValues[scale.id] = isNaN(numVal) ? '' : numVal;
                            });

                            domainObj.items.push({
                                id: `import_i_${domainObj.items.length}_${Date.now()}_${Math.random()}`,
                                text: itemText,
                                values: itemValues
                            });
                        }

                        const parsedDomains = Array.from(newDomainsMap.values());

                        setScales(newScales);
                        setDomains(parsedDomains);

                        /* Clear the input */
                        e.target.value = '';

                    } catch (error) {
                        console.error("Error parsing file:", error);
                        showAlert('حدث خطأ أثناء قراءة الملف. يرجى التأكد من أنه بصيغة Excel صالحة وأن الأعمدة تحتوي على (المحور، البنود).');
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            /* --- Handlers for Scales (Columns) --- */
            const addScale = () => {
                const newId = Date.now().toString();
                setScales([...scales, { id: newId, name: 'مقياس جديد', type: 'positive' }]);
                setDomains(domains.map(d => ({
                    ...d,
                    items: d.items.map(item => ({
                        ...item,
                        values: { ...item.values, [newId]: '' }
                    }))
                })));
            };

            const updateScaleName = (id, newName) => {
                setScales(scales.map(s => s.id === id ? { ...s, name: newName } : s));
            };

            const updateScaleType = (id, newType) => {
                setScales(scales.map(s => s.id === id ? { ...s, type: newType } : s));
            };

            const removeScale = (id) => {
                showConfirm('هل أنت متأكد من حذف هذا العمود؟ سيتم حذفه من جميع البنود.', () => {
                    setScales(scales.filter(s => s.id !== id));
                    setDomains(domains.map(d => ({
                        ...d,
                        items: d.items.map(item => {
                            const newValues = { ...item.values };
                            delete newValues[id];
                            return { ...item, values: newValues };
                        })
                    })));
                });
            };

            /* --- Drag and Drop Logic for Scales --- */
            const handleScaleDragStart = (e, index) => {
                setDraggedScaleIndex(index);
                e.dataTransfer.effectAllowed = "move";
                const ghostNode = e.target.cloneNode(true);
                ghostNode.style.opacity = "0.5";
                document.body.appendChild(ghostNode);
                e.dataTransfer.setDragImage(ghostNode, 0, 0);
                setTimeout(() => document.body.removeChild(ghostNode), 0);
            };

            const handleScaleDragOver = (e, index) => {
                e.preventDefault();
                setDraggedOverScaleIndex(index);
            };

            const handleScaleDrop = (e, targetIndex) => {
                e.preventDefault();
                if (draggedScaleIndex === null) return;
                const newScales = [...scales];
                const draggedScale = newScales.splice(draggedScaleIndex, 1)[0];
                newScales.splice(targetIndex, 0, draggedScale);
                setScales(newScales);
                setDraggedScaleIndex(null);
                setDraggedOverScaleIndex(null);
            };

            const handleScaleDragEnd = () => {
                setDraggedScaleIndex(null);
                setDraggedOverScaleIndex(null);
            };

            /* --- Handlers for Domains & Items --- */
            const addDomain = () => {
                const nextNum = domains.length + 1;
                const defaultName = `محور جديد ${nextNum}`;
                
                showPrompt('الرجاء إدخال مسمى المحور الجديد:', defaultName, (domainName) => {
                    const finalName = domainName.trim() || defaultName;
                    setDomains([...domains, { id: Date.now().toString(), name: finalName, items: [] }]);
                }, 'text');
            };

            const updateDomain = (id, field, value) => {
                setDomains(domains.map(d => d.id === id ? { ...d, [field]: value } : d));
            };

            const removeDomain = (id) => {
                showConfirm('هل أنت متأكد من حذف هذا المحور؟', () => {
                    setDomains(domains.filter(d => d.id !== id));
                });
            };

            const addItem = (domainId) => {
                const initialVals = {};
                scales.forEach(s => initialVals[s.id] = '');

                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: [...d.items, { id: Date.now().toString(), text: 'بند جديد', values: initialVals }] };
                    }
                    return d;
                }));
            };

            const updateItemText = (domainId, itemId, text) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: d.items.map(i => i.id === itemId ? { ...i, text } : i) };
                    }
                    return d;
                }));
            };

            const updateItemValue = (domainId, itemId, scaleId, value) => {
                const finalValue = value === '' ? '' : Number(value);
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return {
                            ...d,
                            items: d.items.map(i => i.id === itemId ? {
                                ...i,
                                values: { ...i.values, [scaleId]: finalValue }
                            } : i)
                        };
                    }
                    return d;
                }));
            };

            const removeItem = (domainId, itemId) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: d.items.filter(i => i.id !== itemId) };
                    }
                    return d;
                }));
            };

            /* --- Drag and Drop Logic for Items --- */
            const handleDragStart = (e, domainId, itemIndex) => {
                setDraggedItem({ domainId, itemIndex });
                e.dataTransfer.effectAllowed = "move";
                const ghostNode = e.target.cloneNode(true);
                ghostNode.style.opacity = "0.5";
                document.body.appendChild(ghostNode);
                e.dataTransfer.setDragImage(ghostNode, 0, 0);
                setTimeout(() => document.body.removeChild(ghostNode), 0);
            };

            const handleDragOver = (e, domainId, itemIndex) => {
                e.preventDefault();
                setDraggedOverItem({ domainId, itemIndex });
            };

            const handleDrop = (e, targetDomainId, targetItemIndex) => {
                e.preventDefault();
                if (!draggedItem) return;

                const { domainId: sourceDomainId, itemIndex: sourceItemIndex } = draggedItem;
                let newDomains = [...domains];
                const sourceDomainIndex = newDomains.findIndex(d => d.id === sourceDomainId);
                const targetDomainIndex = newDomains.findIndex(d => d.id === targetDomainId);

                if (sourceDomainIndex === -1 || targetDomainIndex === -1) return;

                const itemToMove = newDomains[sourceDomainIndex].items[sourceItemIndex];
                newDomains[sourceDomainIndex].items.splice(sourceItemIndex, 1);
                if (targetItemIndex !== undefined) {
                    newDomains[targetDomainIndex].items.splice(targetItemIndex, 0, itemToMove);
                } else {
                    newDomains[targetDomainIndex].items.push(itemToMove);
                }

                setDomains(newDomains);
                setDraggedItem(null);
                setDraggedOverItem(null);
            };

            const handleDragEnd = () => {
                setDraggedItem(null);
                setDraggedOverItem(null);
            };

            /* --- Calculation Helpers --- */
            const getItemRowTotal = (values) => {
                return scales.reduce((sum, scale) => sum + (Number(values[scale.id]) || 0), 0);
            };

            const getPositivesTotal = (values) => {
                return scales.filter(s => s.type === 'positive').reduce((sum, scale) => sum + (Number(values[scale.id]) || 0), 0);
            };

            /* --- Calculating Overall Positives Average --- */
            const totalItemsCount = domains.reduce((count, domain) => count + domain.items.length, 0);
            const overallPositiveAverage = totalItemsCount === 0 ? 0 :
                domains.reduce((sum, domain) => {
                    return sum + domain.items.reduce((itemSum, item) => itemSum + getPositivesTotal(item.values), 0);
                }, 0) / totalItemsCount;

            /* --- Get formatted date and time string --- */
            const getFormattedDateTime = () => {
                const d = new Date();
                const yy = String(d.getFullYear()).slice(-2);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                const ss = String(d.getSeconds()).padStart(2, '0');
                return `${yy}${mm}${dd}_${hh}${min}${ss}`;
            };

            /* --- Excel Export Functions --- */
            const exportEmptyTemplate = () => {
                const data = [];
                const header = ['المحور', 'البنود', ...scales.map(s => s.name), 'إجمالي الصف', 'الإيجابيات'];
                data.push(header);
                data.push(['المحور الأول', 'البند الأول', ...scales.map(() => ''), '', '']);
                data.push(['المحور الأول', 'البند الثاني', ...scales.map(() => ''), '', '']);

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Empty_Template");
                XLSX.writeFile(wb, `Empty_Template_${getFormattedDateTime()}.xlsx`);
            };

            const exportTemplate = () => {
                if (domains.length === 0) {
                    showAlert('يرجى إضافة بيانات لتصديرها أولاً.');
                    return;
                }
                const data = [];
                const header = ['المحور', 'البنود', ...scales.map(s => s.name), 'إجمالي الصف', 'الإيجابيات'];

                domains.forEach(domain => {
                    /* إضافة صف العناوين (المقاييس) قبل كل محور */
                    data.push(header);

                    let domainPosSum = 0;
                    
                    // Add items for this domain
                    domain.items.forEach(item => {
                        const row = [domain.name, item.text];
                        scales.forEach(s => row.push(`${item.values[s.id] || 0}%`));
                        row.push(`${getItemRowTotal(item.values)}%`);
                        const posTotal = getPositivesTotal(item.values);
                        row.push(`${posTotal}%`);
                        data.push(row);
                        domainPosSum += posTotal;
                    });
                    
                    // Add Summary Row for this domain
                    if (domain.items.length > 0) {
                        const domainPosAvg = (domainPosSum / domain.items.length).toFixed(1);
                        const summaryRow = [
                            `متوسط إيجابيات (${domain.name})`, 
                            '', // البنود
                            ...scales.map(() => ''), // المقاييس
                            '', // إجمالي الصف
                            `${domainPosAvg}%` // متوسط الإيجابيات
                        ];
                        data.push(summaryRow);
                        
                        // Add an empty row for visual separation
                        data.push(Array(header.length).fill(''));
                    }
                });

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template");
                XLSX.writeFile(wb, `${originalFileName}_${getFormattedDateTime()}.xlsx`);
            };

            const exportGoogleFormsMock = () => {
                if (domains.length === 0) {
                    showAlert('يرجى إضافة بيانات لإنشاء نتائج وهمية أولاً.');
                    return;
                }
                const data = [];
                const allItems = domains.flatMap(d => d.items.map(i => ({
                    question: `${d.name} [${i.text}]`,
                    values: i.values
                })));
                const header = ['Timestamp', ...allItems.map(i => i.question)];
                data.push(header);

                const itemColumns = allItems.map(itemObj => {
                    let distribution = [];
                    let counts = scales.map(s => {
                        const percentage = Number(itemObj.values[s.id]) || 0;
                        return {
                            name: s.name,
                            exactCount: Math.floor((percentage / 100) * participantsCount),
                            fraction: ((percentage / 100) * participantsCount) % 1
                        };
                    });
                    let currentTotal = counts.reduce((sum, c) => sum + c.exactCount, 0);
                    let remainder = participantsCount - currentTotal;
                    counts.sort((a, b) => b.fraction - a.fraction);
                    for (let i = 0; i < remainder; i++) {
                        counts[i % counts.length].exactCount++;
                    }
                    counts.forEach(c => {
                        for (let i = 0; i < c.exactCount; i++) {
                            distribution.push(c.name);
                        }
                    });
                    for (let i = distribution.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
                    }
                    return distribution;
                });

                for (let i = 0; i < participantsCount; i++) {
                    const row = [];
                    const date = new Date(Date.now() - Math.floor(Math.random() * 7 * 24 * 60 * 60 * 1000));
                    row.push(date.toLocaleString('en-GB'));
                    itemColumns.forEach(column => {
                        row.push(column[i]);
                    });
                    data.push(row);
                }

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Form Responses");
                XLSX.writeFile(wb, `${originalFileName}_Forms_${getFormattedDateTime()}.xlsx`);
            };

            return (
                <div className="max-w-screen-2xl mx-auto p-4 md:p-6 font-sans">
                    {/* --- Custom Modal Overlay --- */}
                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 transition-opacity duration-300">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center border-t-4 border-blue-500 transform scale-100 transition-transform duration-300">
                                <h3 className="text-2xl font-bold mb-4 text-gray-800">
                                    {modalConfig.type === 'alert' ? 'تنبيه' : modalConfig.type === 'confirm' ? 'تأكيد الإجراء' : 'إدخال البيانات'}
                                </h3>
                                <p className="text-lg text-gray-600 mb-6 font-light leading-relaxed">{modalConfig.message}</p>
                                
                                {modalConfig.type === 'prompt' && modalConfig.inputType === 'number' && (
                                    <div className="flex items-stretch justify-center shadow-inner rounded-lg overflow-hidden border border-gray-300 mb-6 mx-auto w-4/5">
                                        <button 
                                            onClick={() => setTempPromptValue(Math.max(0, Number(tempPromptValue) - 1))}
                                            className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 flex items-center justify-center transition-colors border-l border-gray-300"
                                        >
                                            <i className="fas fa-minus text-xl"></i>
                                        </button>
                                        <input
                                            type="number"
                                            min="0" max="100"
                                            value={tempPromptValue}
                                            onChange={(e) => setTempPromptValue(e.target.value)}
                                            className="w-full p-3 text-3xl text-center focus:outline-none font-black text-green-700 flex-1"
                                        />
                                        <button 
                                            onClick={() => setTempPromptValue(Math.min(100, Number(tempPromptValue) + 1))}
                                            className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 flex items-center justify-center transition-colors border-r border-gray-300"
                                        >
                                            <i className="fas fa-plus text-xl"></i>
                                        </button>
                                    </div>
                                )}

                                {modalConfig.type === 'prompt' && modalConfig.inputType === 'text' && (
                                    <input
                                        type="text"
                                        value={tempPromptValue}
                                        onChange={(e) => setTempPromptValue(e.target.value)}
                                        className="w-full p-3 border border-gray-300 rounded-lg text-2xl text-center focus:outline-none focus:border-green-500 font-black text-blue-700 mb-6 shadow-inner"
                                    />
                                )}
                                
                                <div className="flex justify-center gap-3">
                                    {(modalConfig.type === 'confirm' || modalConfig.type === 'prompt') && (
                                        <button
                                            onClick={() => { if (modalConfig.onConfirm) modalConfig.onConfirm(tempPromptValue); closeModal(); }}
                                            className="bg-green-500 text-white px-6 py-2 rounded-lg text-lg hover:bg-green-600 hover:scale-105 transition-all duration-200 shadow-md font-bold"
                                        >
                                            تأكيد
                                        </button>
                                    )}
                                    <button
                                        onClick={closeModal}
                                        className="bg-red-500 text-white px-6 py-2 rounded-lg text-lg hover:bg-red-600 hover:scale-105 transition-all duration-200 shadow-md font-bold"
                                    >
                                        {modalConfig.type === 'alert' ? 'حسناً' : 'إلغاء'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation & Logos */}
                    <div className="flex justify-between items-center mb-6 bg-white p-3 md:p-4 rounded-xl shadow-lg hover-zoom border-t-4 border-blue-500">
                        <img src="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/00.png" alt="Logo Right" className="h-12 md:h-16 w-auto object-contain drop-shadow-md" />
                        <a href="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/" className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm md:text-lg hover:bg-blue-700 hover:scale-105 transition-all duration-200 shadow-md flex items-center gap-2 font-bold leading-tight">
                            <i className="fas fa-home"></i> الرئيسية
                        </a>
                        <img src="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/02.jpg" alt="Logo Left" className="h-12 md:h-16 w-auto object-contain rounded-lg shadow-sm" />
                    </div>

                    {/* Header */}
                    <div className="text-center mb-6">
                        <h1 className="text-4xl md:text-5xl thin-title text-blue-900 mb-1 font-black">البرنامج العالمي لضرب الاستبيانات</h1>
                        <p className="text-lg md:text-xl thin-title text-blue-700 font-bold">Design Sub-items, Columns, and Percentages</p>
                    </div>

                    {/* Advanced Tools Section & Exports (Combined and Compact) */}
                    <div className="bg-white p-4 rounded-xl shadow-lg mb-6 border-t-4 border-green-500 hover-zoom">
                        <div className="flex flex-wrap justify-center gap-3">
                            <button onClick={exportEmptyTemplate} className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm md:text-base hover:bg-blue-600 hover:scale-105 transition-all shadow-md flex items-center gap-2 font-bold leading-tight">
                                <i className="fas fa-file-download"></i> تحميل قالب فارغ
                            </button>
                            <label className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm md:text-base hover:bg-blue-600 hover:scale-105 transition-all shadow-md cursor-pointer flex items-center gap-2 m-0 font-bold leading-tight">
                                <i className="fas fa-upload"></i> رفع قالب (Excel)
                                <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
                            </label>
                            <button onClick={handleAutoFill} className="bg-green-500 text-white px-4 py-2 rounded-lg text-sm md:text-base hover:bg-green-600 hover:scale-105 transition-all shadow-md flex items-center gap-2 font-bold leading-tight">
                                <i className="fas fa-magic"></i> تعبئة تلقائية
                            </button>
                            <button onClick={exportTemplate} className="bg-green-500 text-white px-4 py-2 rounded-lg text-sm md:text-base hover:bg-green-600 hover:scale-105 transition-all shadow-md flex items-center gap-2 font-bold leading-tight">
                                <i className="fas fa-file-excel"></i> تحميل التقييم
                            </button>
                            <button onClick={exportGoogleFormsMock} className="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm md:text-base hover:bg-gray-600 hover:scale-105 transition-all shadow-md flex items-center gap-2 font-bold leading-tight">
                                <i className="fas fa-chart-pie"></i> نتائج وهمية (Forms)
                            </button>
                        </div>
                    </div>

                    {/* Settings - Participants Count */}
                    <div className="bg-white p-4 rounded-xl shadow-lg mb-6 border-t-4 border-purple-500 flex flex-col sm:flex-row justify-center items-center gap-4 hover-zoom">
                        <h2 className="text-xl thin-title text-gray-800 font-black m-0">عدد المشاركين (Participants)</h2>
                        <div className="flex items-center gap-3">
                            <i className="fas fa-users text-2xl text-purple-500"></i>
                            <div className="flex items-stretch shadow-sm rounded-lg overflow-hidden border border-gray-300">
                                <button 
                                    onClick={() => setParticipantsCount(Math.max(1, participantsCount - 1))}
                                    className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 flex items-center justify-center transition-colors border-l border-gray-300"
                                >
                                    <i className="fas fa-minus"></i>
                                </button>
                                <input
                                    type="number"
                                    min="1"
                                    value={participantsCount}
                                    onChange={(e) => setParticipantsCount(Math.max(1, Number(e.target.value)))}
                                    className="w-20 p-2 text-xl text-center focus:outline-none font-black text-indigo-800 leading-none"
                                />
                                <button 
                                    onClick={() => setParticipantsCount(participantsCount + 1)}
                                    className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 flex items-center justify-center transition-colors border-r border-gray-300"
                                >
                                    <i className="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Scale Columns Manager (Global) */}
                    <div className="bg-white p-4 md:p-6 rounded-xl shadow-lg mb-6 hover-zoom">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl md:text-2xl thin-title text-gray-800 font-black">إدارة الأعمدة / المقاييس</h2>
                            <button
                                onClick={addScale}
                                className="bg-green-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-600 hover:scale-105 transition-all shadow-md flex items-center gap-2 font-bold"
                            >
                                <i className="fas fa-columns"></i> إضافة عمود
                            </button>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            {scales.map((scale, index) => {
                                const isDraggedOver = draggedOverScaleIndex === index;
                                return (
                                    <div
                                        key={scale.id}
                                        draggable
                                        onDragStart={(e) => handleScaleDragStart(e, index)}
                                        onDragOver={(e) => handleScaleDragOver(e, index)}
                                        onDrop={(e) => handleScaleDrop(e, index)}
                                        onDragEnd={handleScaleDragEnd}
                                        className={`flex flex-col sm:flex-row items-center gap-2 bg-blue-50 border p-2 rounded-lg shadow-sm cursor-move transition-all hover:shadow-md
                                            ${isDraggedOver ? 'border-dashed border-blue-500 bg-blue-100 scale-105' : 'border-blue-200'}
                                        `}
                                        title="اسحب لتغيير الترتيب"
                                    >
                                        <i className="fas fa-grip-vertical text-gray-400 px-1 cursor-move hover:text-blue-500 text-sm"></i>
                                        <input
                                            type="text"
                                            value={scale.name}
                                            onChange={(e) => updateScaleName(scale.id, e.target.value)}
                                            className="p-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500 w-32 text-center font-bold"
                                            placeholder="اسم العمود"
                                        />
                                        <select
                                            value={scale.type || 'neutral'}
                                            onChange={(e) => updateScaleType(scale.id, e.target.value)}
                                            className={`p-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500 font-bold cursor-pointer
                                                ${scale.type === 'positive' ? 'text-green-700 bg-green-100' :
                                                    scale.type === 'negative' ? 'text-red-700 bg-red-100' :
                                                        'text-gray-700 bg-gray-100'}`}
                                        >
                                            <option value="positive">إيجابي (+)</option>
                                            <option value="neutral">محايد (0)</option>
                                            <option value="negative">سلبي (-)</option>
                                        </select>
                                        {scales.length > 1 && (
                                            <button onClick={() => removeScale(scale.id)} className="text-red-500 hover:text-red-700 px-2 text-xl hover:scale-110 transition-transform" title="حذف العمود">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Overall Positives Average Banner (Appears only when data exists) */}
                    {totalItemsCount > 0 && (
                        <div className="bg-green-100 border-t-4 border-green-500 p-4 md:p-6 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4 hover-zoom">
                            <h2 className="text-2xl md:text-3xl thin-title text-green-900 font-black">المتوسط العام للإيجابيات (Overall Positive Average)</h2>
                            <div className="text-3xl md:text-4xl font-black text-green-700 bg-white px-6 py-2 rounded-lg shadow-sm border border-green-200">
                                {overallPositiveAverage.toFixed(1)}%
                            </div>
                        </div>
                    )}

                    {/* Domains & Grid Layout */}
                    <div className="mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-2xl md:text-3xl thin-title text-gray-800 font-black">المحاور والبنود (Axes Matrix)</h2>
                        </div>
                        
                        {domains.length === 0 && (
                            <div className="bg-white p-8 rounded-xl shadow-md border-t-2 border-gray-300 text-center hover-zoom">
                                <i className="fas fa-folder-open text-4xl text-gray-300 mb-2"></i>
                                <h3 className="text-xl text-gray-500 font-black">لا توجد محاور لعرضها حالياً</h3>
                                <p className="text-gray-400 mt-1 text-sm font-bold">قم بإضافة محور جديد أو رفع ملف قالب Excel للبدء.</p>
                                
                                <button
                                    onClick={addDomain}
                                    className="mt-6 bg-green-500 text-white px-6 py-3 rounded-lg text-lg hover:bg-green-600 hover:scale-105 transition-all shadow-md font-black flex items-center gap-2 mx-auto"
                                >
                                    <i className="fas fa-folder-plus"></i> إضافة محور جديد
                                </button>
                            </div>
                        )}

                        {domains.map(domain => (
                            <div
                                key={domain.id}
                                className="bg-white p-4 md:p-6 rounded-xl shadow-lg mb-6 border-r-4 border-blue-500 hover-zoom"
                                onDragOver={(e) => {
                                    if (domain.items.length === 0) handleDragOver(e, domain.id, 0);
                                }}
                                onDrop={(e) => {
                                    if (domain.items.length === 0) handleDrop(e, domain.id, 0);
                                }}
                            >
                                {/* Domain Header */}
                                <div className="flex flex-col md:flex-row gap-3 mb-4 pb-4 border-b border-gray-100 items-end">
                                    <div className="flex-1 w-full">
                                        <label className="block text-indigo-800 mb-1 text-xs font-black uppercase tracking-widest">اسم المحور</label>
                                        <input
                                            type="text"
                                            value={domain.name}
                                            onChange={(e) => updateDomain(domain.id, 'name', e.target.value)}
                                            className="w-full p-2 md:p-3 border border-gray-200 rounded-lg text-xl md:text-2xl font-black focus:outline-none focus:border-blue-500 bg-blue-50"
                                            placeholder="أدخل اسم المحور"
                                        />
                                    </div>
                                    <div className="flex gap-2 shrink-0 w-full md:w-auto justify-center">
                                        <button
                                            onClick={() => addItem(domain.id)}
                                            className="bg-green-500 text-white px-4 py-2 rounded-lg text-sm md:text-base hover:bg-green-600 hover:scale-105 transition-all shadow-md font-bold h-fit flex items-center gap-2 justify-center"
                                        >
                                            <i className="fas fa-plus-circle"></i> إضافة بند (سؤال)
                                        </button>
                                    </div>
                                </div>

                                {/* Items Grid/Table Structure */}
                                <div className="w-full overflow-x-auto">
                                    <div className="min-w-[1050px]">
                                        {/* Table Header */}
                                        <div className="flex bg-slate-100 p-2 rounded-t-lg font-black text-gray-700 border border-gray-200">
                                            <div className="w-8"></div>
                                            <div className="flex-1 px-2 text-sm md:text-base">البنود (Sub-items)</div>
                                            {scales.map(scale => (
                                                <div key={scale.id} className={`w-28 text-center px-1 text-xs md:text-sm flex flex-col items-center justify-center
                                                    ${scale.type === 'positive' ? 'text-green-700' :
                                                        scale.type === 'negative' ? 'text-red-700' :
                                                            'text-gray-600'}`}
                                                >
                                                    <span className="font-black truncate w-full">{scale.name}</span>
                                                    {scale.type === 'positive' && <i className="fas fa-plus text-[10px] mt-0.5"></i>}
                                                    {scale.type === 'negative' && <i className="fas fa-minus text-[10px] mt-0.5"></i>}
                                                    {scale.type === 'neutral' && <i className="fas fa-circle text-[8px] mt-0.5 opacity-50"></i>}
                                                </div>
                                            ))}
                                            <div className="w-24 text-center px-1 font-black text-xs md:text-sm text-blue-800">إجمالي الصف</div>
                                            <div className="w-24 text-center px-1 font-black text-xs md:text-sm text-green-700">إيجابيات</div>
                                            <div className="w-10 text-center"></div>
                                        </div>

                                        {/* Items Rows */}
                                        <div className="border-x border-b border-gray-200 rounded-b-lg pb-2 bg-gray-50 space-y-1 p-2">
                                            {domain.items.map((item, iIndex) => {
                                                const isDraggedOver = draggedOverItem && draggedOverItem.domainId === domain.id && draggedOverItem.itemIndex === iIndex;
                                                const rowTotal = getItemRowTotal(item.values);
                                                const posTotal = getPositivesTotal(item.values);
                                                const isRowValid = Math.abs(rowTotal - 100) < 0.1;

                                                return (
                                                    <div
                                                        key={item.id}
                                                        draggable
                                                        onDragStart={(e) => handleDragStart(e, domain.id, iIndex)}
                                                        onDragOver={(e) => handleDragOver(e, domain.id, iIndex)}
                                                        onDrop={(e) => handleDrop(e, domain.id, iIndex)}
                                                        onDragEnd={handleDragEnd}
                                                        className={`flex items-center gap-1 p-1 md:p-2 rounded-lg bg-white border shadow-sm transition-all cursor-move hover:shadow-md
                                                            ${isDraggedOver ? 'border-dashed border-2 border-blue-400 bg-blue-50' : (isRowValid ? 'border-gray-200' : 'border-2 border-red-600 ring-2 ring-red-100')}
                                                        `}
                                                    >
                                                        {/* Drag Handle */}
                                                        <div className="w-8 flex justify-center text-gray-400 hover:text-indigo-600 transition-colors">
                                                            <i className="fas fa-grip-vertical text-lg"></i>
                                                        </div>
                                                        
                                                        {/* Item Text Input */}
                                                        <div className="flex-1 px-1">
                                                            <input
                                                                type="text"
                                                                value={item.text}
                                                                onChange={(e) => updateItemText(domain.id, item.id, e.target.value)}
                                                                className="w-full p-2 border border-gray-300 rounded-md text-sm md:text-base font-bold focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-100"
                                                                placeholder="أدخل نص البند..."
                                                            />
                                                        </div>

                                                        {/* Percentage Cells with Custom +/- */}
                                                        {scales.map(scale => (
                                                            <div key={`cell-${scale.id}`} className="w-28 px-1 flex items-center justify-center">
                                                                <div className={`flex w-full items-stretch rounded-md overflow-hidden border transition-colors
                                                                    ${scale.type === 'positive' ? 'border-green-200 focus-within:border-green-500 focus-within:ring-1 focus-within:ring-green-200' :
                                                                    scale.type === 'negative' ? 'border-red-200 focus-within:border-red-500 focus-within:ring-1 focus-within:ring-red-200' :
                                                                    'border-gray-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-200'}`}
                                                                >
                                                                    <button 
                                                                        onClick={() => updateItemValue(domain.id, item.id, scale.id, Math.max(0, (Number(item.values[scale.id]) || 0) - 1))}
                                                                        className={`px-2 flex items-center justify-center transition-colors border-l
                                                                            ${scale.type === 'positive' ? 'bg-green-100 hover:bg-green-200 text-green-800 border-green-200' :
                                                                            scale.type === 'negative' ? 'bg-red-100 hover:bg-red-200 text-red-800 border-red-200' :
                                                                            'bg-gray-100 hover:bg-gray-200 text-gray-800 border-gray-300'}`}
                                                                    >
                                                                        <i className="fas fa-minus text-[10px]"></i>
                                                                    </button>
                                                                    <input
                                                                        type="number"
                                                                        value={item.values[scale.id] !== undefined ? item.values[scale.id] : ''}
                                                                        onChange={(e) => updateItemValue(domain.id, item.id, scale.id, e.target.value)}
                                                                        className={`w-full py-2 text-center text-sm md:text-base focus:outline-none font-black transition-colors flex-1
                                                                            ${scale.type === 'positive' ? 'bg-green-50 text-green-800' :
                                                                            scale.type === 'negative' ? 'bg-red-50 text-red-800' :
                                                                            'bg-white text-gray-800'}`}
                                                                    />
                                                                    <button 
                                                                        onClick={() => updateItemValue(domain.id, item.id, scale.id, Math.min(100, (Number(item.values[scale.id]) || 0) + 1))}
                                                                        className={`px-2 flex items-center justify-center transition-colors border-r
                                                                            ${scale.type === 'positive' ? 'bg-green-100 hover:bg-green-200 text-green-800 border-green-200' :
                                                                            scale.type === 'negative' ? 'bg-red-100 hover:bg-red-200 text-red-800 border-red-200' :
                                                                            'bg-gray-100 hover:bg-gray-200 text-gray-800 border-gray-300'}`}
                                                                    >
                                                                        <i className="fas fa-plus text-[10px]"></i>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))}

                                                        {/* Row Total */}
                                                        <div className="w-24 flex items-center justify-center">
                                                            <div className={`w-full text-center font-black text-sm md:text-base px-1 py-1.5 rounded-md transition-colors ${isRowValid ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                                                                {rowTotal.toFixed(1)}%
                                                            </div>
                                                        </div>

                                                        {/* Positives Total */}
                                                        <div className="w-24 flex items-center justify-center">
                                                            <div className={`w-full text-center font-black text-sm md:text-base px-1 py-1.5 rounded-md transition-colors bg-green-100 text-green-700`}>
                                                                {posTotal.toFixed(1)}%
                                                            </div>
                                                        </div>

                                                        {/* Delete Row */}
                                                        <div className="w-10 flex justify-center">
                                                            <button
                                                                onClick={() => removeItem(domain.id, item.id)}
                                                                className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 w-7 h-7 rounded-full transition-all flex items-center justify-center hover:scale-110 shadow-sm"
                                                                title="حذف البند"
                                                            >
                                                                <i className="fas fa-times text-sm"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="mt-4 flex justify-end border-t border-gray-100 pt-4">
                                    <button
                                        onClick={() => removeDomain(domain.id)}
                                        className="bg-red-500 text-white px-5 py-2 rounded-lg text-sm md:text-base hover:bg-red-600 hover:scale-105 transition-all shadow-md font-bold flex items-center gap-2"
                                        title="حذف المحور بالكامل"
                                    >
                                        <i className="fas fa-trash-alt"></i> حذف المحور
                                    </button>
                                </div>
                            </div>
                        ))}

                        {/* Button moved to the very bottom of the domains list */}
                        {domains.length > 0 && (
                            <div className="flex justify-center mt-8 mb-4 hover-zoom">
                                <button
                                    onClick={addDomain}
                                    className="bg-green-500 text-white px-8 py-4 rounded-xl text-xl md:text-2xl hover:bg-green-600 hover:scale-105 transition-all shadow-xl font-black flex items-center gap-3 border-b-4 border-green-700"
                                >
                                    <i className="fas fa-folder-plus text-3xl"></i> إضافة محور جديد
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
