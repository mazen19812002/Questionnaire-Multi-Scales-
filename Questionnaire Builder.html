<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire Designer</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS for Excel generation and parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Custom scrollbar for drag-and-drop areas */
        .drag-over {
            border: 2px dashed #3b82f6 !important;
            background-color: #eff6ff !important;
        }
        /* Hide number input arrows for cleaner look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .hover-zoom { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; }
        .hover-zoom:hover { transform: scale(1.02); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .thin-title { font-weight: 300; letter-spacing: -0.01em; }
    </style>
</head>
<body class="bg-blue-100 min-h-screen pb-24">
    <div id="root"></div>

    <!-- Personalized Footer -->
    <footer class="fixed bottom-0 left-0 w-full bg-gray-900 text-white text-center py-3 z-50 shadow-lg">
        <p class="text-lg font-light tracking-wide uppercase">
            All rights are reserved to Dr. Mazen Badawy – Doctorate of English Teaching & Testing
        </p>
    </footer>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* --- Initial Data Structure (Starts Empty as requested) --- */
        const initialScales = [
            { id: 's1', name: 'موافق', type: 'positive' },
            { id: 's2', name: 'إلى حد ما', type: 'neutral' },
            { id: 's3', name: 'غير موافق', type: 'negative' }
        ];

        /* Domains start completely empty */
        const initialDomains = [];

        function App() {
            const [scales, setScales] = useState(initialScales);
            const [domains, setDomains] = useState(initialDomains);
            
            /* Modal State for avoiding native alerts/confirms */
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null });

            /* Drag and drop state for items */
            const [draggedItem, setDraggedItem] = useState(null);
            const [draggedOverItem, setDraggedOverItem] = useState(null);

            /* Drag and drop state for scales (columns) */
            const [draggedScaleIndex, setDraggedScaleIndex] = useState(null);
            const [draggedOverScaleIndex, setDraggedOverScaleIndex] = useState(null);

            /* Number of participants (Default to 100 to prevent percentage fractional drift in mock data) */
            const [participantsCount, setParticipantsCount] = useState(100);

            /* --- Custom Modal Helpers --- */
            const showAlert = (message) => setModalConfig({ isOpen: true, type: 'alert', message, onConfirm: null });
            const showConfirm = (message, onConfirm) => setModalConfig({ isOpen: true, type: 'confirm', message, onConfirm });
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false });

            /* --- Handlers for Auto Fill (Smart Percentage Generator) --- */
            const handleAutoFill = () => {
                if (domains.length === 0) {
                    showAlert('لا توجد مجالات أو بنود لتعبئتها. يرجى إضافة مجالات أولاً أو رفع ملف.');
                    return;
                }

                /* Immediate execution: No confirm needed to keep it fast and responsive */
                setDomains(prevDomains => prevDomains.map(domain => {
                    const newItems = domain.items.map(item => {
                        const posScales = scales.filter(s => s.type === 'positive');
                        const negScales = scales.filter(s => s.type === 'negative');
                        const neuScales = scales.filter(s => s.type === 'neutral');

                        /* Positive: roughly 70% (random between 65% and 75%) */
                        let posBudget = posScales.length > 0 ? Math.floor(Math.random() * 11) + 65 : 0;
                        
                        /* Negative: less than 15% (random between 5% and 14%) */
                        let negBudget = negScales.length > 0 ? Math.floor(Math.random() * 10) + 5 : 0;
                        
                        /* Adjust if we have no neutral scales to soak up the remainder */
                        if (neuScales.length === 0) {
                            if (posScales.length > 0 && negScales.length > 0) {
                                negBudget = Math.floor(Math.random() * 10) + 5;
                                posBudget = 100 - negBudget;
                            } else if (posScales.length > 0) {
                                posBudget = 100;
                            } else if (negScales.length > 0) {
                                negBudget = 100;
                            }
                        }

                        /* Neutral takes whatever is left to guarantee row equals exactly 100% */
                        let neuBudget = 100 - posBudget - negBudget;
                        if (neuBudget < 0) neuBudget = 0;

                        const newValues = { ...item.values };

                        /* Distribute function across multiple scales of the same type if they exist */
                        const distribute = (budget, scalesArray) => {
                            if (scalesArray.length === 0) return;
                            if (scalesArray.length === 1) {
                                newValues[scalesArray[0].id] = budget;
                                return;
                            }
                            let remaining = budget;
                            scalesArray.forEach((s, index) => {
                                if (index === scalesArray.length - 1) {
                                    newValues[s.id] = remaining;
                                } else {
                                    const alloc = Math.floor(Math.random() * (remaining / 2)) + Math.floor(remaining / scalesArray.length);
                                    const finalAlloc = Math.min(alloc, remaining);
                                    newValues[s.id] = finalAlloc;
                                    remaining -= finalAlloc;
                                }
                            });
                        };

                        distribute(posBudget, posScales);
                        distribute(negBudget, negScales);
                        distribute(neuBudget, neuScales);

                        return { ...item, values: newValues };
                    });
                    return { ...domain, items: newItems };
                }));
            };

            /* --- Handlers for Excel Upload --- */
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataArray = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(dataArray, { type: 'array' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        if (data.length < 2) {
                            showAlert('الملف المرفوع فارغ أو لا يحتوي على بيانات صحيحة.');
                            return;
                        }

                        /* 1. Parse Headers (Scales) */
                        const headers = data[0];
                        const domainIdx = headers.indexOf('المجال') !== -1 ? headers.indexOf('المجال') : 0;
                        const itemIdx = headers.indexOf('البنود') !== -1 ? headers.indexOf('البنود') : 1;
                        const totalIdx = headers.indexOf('المجموع') !== -1 ? headers.indexOf('المجموع') : headers.indexOf('إجمالي الصف (%)');
                        
                        const endScaleIdx = totalIdx !== -1 ? totalIdx : headers.length;
                        const scaleNames = headers.slice(itemIdx + 1, endScaleIdx);

                        const newScales = scaleNames.map((name, idx) => ({
                            id: `import_s_${idx}_${Date.now()}`,
                            name: name || `مقياس ${idx + 1}`,
                            type: idx === 0 ? 'positive' : (idx === scaleNames.length - 1 ? 'negative' : 'neutral')
                        }));

                        /* 2. Parse Domains and Items */
                        const newDomainsMap = new Map();

                        for (let i = 1; i < data.length; i++) {
                            const row = data[i];
                            if (!row || row.length === 0 || !row[domainIdx]) continue;

                            const domainName = row[domainIdx];
                            const itemText = row[itemIdx] || 'بند بدون نص';

                            if (!newDomainsMap.has(domainName)) {
                                newDomainsMap.set(domainName, {
                                    id: `import_d_${newDomainsMap.size}_${Date.now()}`,
                                    name: domainName,
                                    items: []
                                });
                            }

                            const domainObj = newDomainsMap.get(domainName);
                            
                            const itemValues = {};
                            newScales.forEach((scale, idx) => {
                                const cellVal = row[itemIdx + 1 + idx];
                                let numVal = 0;
                                if (cellVal !== undefined && cellVal !== null && cellVal !== '') {
                                    if(typeof cellVal === 'string') {
                                        numVal = Number(cellVal.replace('%', '').trim());
                                    } else {
                                        numVal = Number(cellVal);
                                    }
                                } else {
                                    numVal = '';
                                }
                                itemValues[scale.id] = isNaN(numVal) ? '' : numVal;
                            });

                            domainObj.items.push({
                                id: `import_i_${domainObj.items.length}_${Date.now()}_${Math.random()}`,
                                text: itemText,
                                values: itemValues
                            });
                        }

                        const parsedDomains = Array.from(newDomainsMap.values());

                        setScales(newScales);
                        setDomains(parsedDomains);
                        
                        /* Clear the input */
                        e.target.value = '';

                    } catch (error) {
                        console.error("Error parsing file:", error);
                        showAlert('حدث خطأ أثناء قراءة الملف. يرجى التأكد من أنه بصيغة Excel صالحة وأن الأعمدة تحتوي على (المجال، البنود).');
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            /* --- Handlers for Scales (Columns) --- */
            const addScale = () => {
                const newId = Date.now().toString();
                setScales([...scales, { id: newId, name: 'مقياس جديد', type: 'positive' }]);
                
                setDomains(domains.map(d => ({
                    ...d,
                    items: d.items.map(item => ({
                        ...item,
                        values: { ...item.values, [newId]: '' }
                    }))
                })));
            };

            const updateScaleName = (id, newName) => {
                setScales(scales.map(s => s.id === id ? { ...s, name: newName } : s));
            };

            const updateScaleType = (id, newType) => {
                setScales(scales.map(s => s.id === id ? { ...s, type: newType } : s));
            };

            const removeScale = (id) => {
                showConfirm('هل أنت متأكد من حذف هذا العمود (المقياس)؟ سيتم حذفه من جميع البنود.', () => {
                    setScales(scales.filter(s => s.id !== id));
                    setDomains(domains.map(d => ({
                        ...d,
                        items: d.items.map(item => {
                            const newValues = { ...item.values };
                            delete newValues[id];
                            return { ...item, values: newValues };
                        })
                    })));
                });
            };

            /* --- Drag and Drop Logic for Scales --- */
            const handleScaleDragStart = (e, index) => {
                setDraggedScaleIndex(index);
                e.dataTransfer.effectAllowed = "move";
                const ghostNode = e.target.cloneNode(true);
                ghostNode.style.opacity = "0.5";
                document.body.appendChild(ghostNode);
                e.dataTransfer.setDragImage(ghostNode, 0, 0);
                setTimeout(() => document.body.removeChild(ghostNode), 0);
            };

            const handleScaleDragOver = (e, index) => {
                e.preventDefault();
                setDraggedOverScaleIndex(index);
            };

            const handleScaleDrop = (e, targetIndex) => {
                e.preventDefault();
                if (draggedScaleIndex === null) return;
                
                const newScales = [...scales];
                const draggedScale = newScales.splice(draggedScaleIndex, 1)[0];
                newScales.splice(targetIndex, 0, draggedScale);
                
                setScales(newScales);
                setDraggedScaleIndex(null);
                setDraggedOverScaleIndex(null);
            };

            const handleScaleDragEnd = () => {
                setDraggedScaleIndex(null);
                setDraggedOverScaleIndex(null);
            };

            /* --- Handlers for Domains & Items --- */
            const addDomain = () => {
                setDomains([...domains, { id: Date.now().toString(), name: 'مجال جديد', items: [] }]);
            };

            const updateDomain = (id, field, value) => {
                setDomains(domains.map(d => d.id === id ? { ...d, [field]: value } : d));
            };

            const removeDomain = (id) => {
                showConfirm('هل أنت متأكد من حذف هذا المجال؟', () => {
                    setDomains(domains.filter(d => d.id !== id));
                });
            };

            const addItem = (domainId) => {
                const initialVals = {};
                scales.forEach(s => initialVals[s.id] = '');

                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: [...d.items, { id: Date.now().toString(), text: 'بند جديد', values: initialVals }] };
                    }
                    return d;
                }));
            };

            const updateItemText = (domainId, itemId, text) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: d.items.map(i => i.id === itemId ? { ...i, text } : i) };
                    }
                    return d;
                }));
            };

            const updateItemValue = (domainId, itemId, scaleId, value) => {
                const finalValue = value === '' ? '' : Number(value);
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { 
                            ...d, 
                            items: d.items.map(i => i.id === itemId ? {
                                ...i,
                                values: { ...i.values, [scaleId]: finalValue }
                            } : i) 
                        };
                    }
                    return d;
                }));
            };

            const removeItem = (domainId, itemId) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: d.items.filter(i => i.id !== itemId) };
                    }
                    return d;
                }));
            };

            /* --- Drag and Drop Logic for Items --- */
            const handleDragStart = (e, domainId, itemIndex) => {
                setDraggedItem({ domainId, itemIndex });
                e.dataTransfer.effectAllowed = "move";
                const ghostNode = e.target.cloneNode(true);
                ghostNode.style.opacity = "0.5";
                document.body.appendChild(ghostNode);
                e.dataTransfer.setDragImage(ghostNode, 0, 0);
                setTimeout(() => document.body.removeChild(ghostNode), 0);
            };

            const handleDragOver = (e, domainId, itemIndex) => {
                e.preventDefault();
                setDraggedOverItem({ domainId, itemIndex });
            };

            const handleDrop = (e, targetDomainId, targetItemIndex) => {
                e.preventDefault();
                if (!draggedItem) return;

                const { domainId: sourceDomainId, itemIndex: sourceItemIndex } = draggedItem;
                let newDomains = [...domains];
                
                const sourceDomainIndex = newDomains.findIndex(d => d.id === sourceDomainId);
                const targetDomainIndex = newDomains.findIndex(d => d.id === targetDomainId);

                if (sourceDomainIndex === -1 || targetDomainIndex === -1) return;

                const itemToMove = newDomains[sourceDomainIndex].items[sourceItemIndex];
                newDomains[sourceDomainIndex].items.splice(sourceItemIndex, 1);
                
                if (targetItemIndex !== undefined) {
                    newDomains[targetDomainIndex].items.splice(targetItemIndex, 0, itemToMove);
                } else {
                    newDomains[targetDomainIndex].items.push(itemToMove);
                }

                setDomains(newDomains);
                setDraggedItem(null);
                setDraggedOverItem(null);
            };

            const handleDragEnd = () => {
                setDraggedItem(null);
                setDraggedOverItem(null);
            };

            /* --- Calculation Helpers (Mirroring the Analyzer Math) --- */
            const getItemRowTotal = (values) => {
                return scales.reduce((sum, scale) => sum + (Number(values[scale.id]) || 0), 0);
            };

            const getPositivesTotal = (values) => {
                return scales.filter(s => s.type === 'positive').reduce((sum, scale) => sum + (Number(values[scale.id]) || 0), 0);
            };

            /* --- Excel Export Functions --- */
            const exportEmptyTemplate = () => {
                const data = [];
                const header = ['المجال', 'البنود', ...scales.map(s => s.name), 'المجموع'];
                data.push(header);
                /* إضافة صفوف نموذجية فارغة لتوضيح طريقة الإدخال */
                data.push(['المجال الأول', 'البند الأول', '', '', '', '1']);
                data.push(['المجال الأول', 'البند الثاني', '', '', '', '1']);

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Empty_Template");
                XLSX.writeFile(wb, "Empty_Questionnaire_Template.xlsx");
            };

            const exportTemplate = () => {
                if (domains.length === 0) {
                    showAlert('يرجى إضافة بيانات لتصديرها أولاً.');
                    return;
                }
                const data = [];
                const header = ['المجال', 'البنود', ...scales.map(s => s.name), 'المجموع'];
                data.push(header);

                domains.forEach(domain => {
                    domain.items.forEach(item => {
                        const row = [domain.name, item.text];
                        scales.forEach(s => row.push(`${item.values[s.id] || 0}%`));
                        /* Using raw unrounded item for export exactly like original layout requested */
                        row.push(`${getItemRowTotal(item.values)}%`);
                        data.push(row);
                    });
                });

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template");
                XLSX.writeFile(wb, "Questionnaire_Design_Data.xlsx");
            };

            const exportGoogleFormsMock = () => {
                if (domains.length === 0) {
                    showAlert('يرجى إضافة بيانات لإنشاء نتائج وهمية أولاً.');
                    return;
                }
                const data = [];
                const allItems = domains.flatMap(d => d.items.map(i => ({ 
                    question: `${d.name} [${i.text}]`,
                    values: i.values
                })));
                
                const header = ['Timestamp', ...allItems.map(i => i.question)];
                data.push(header);

                /* Pre-calculate exact distribution for each item column based on percentages */
                const itemColumns = allItems.map(itemObj => {
                    let distribution = [];
                    let counts = scales.map(s => {
                        const percentage = Number(itemObj.values[s.id]) || 0;
                        return {
                            name: s.name,
                            exactCount: Math.floor((percentage / 100) * participantsCount),
                            fraction: ((percentage / 100) * participantsCount) % 1
                        };
                    });
                    
                    /* Handle rounding remainders to ensure exact participant count */
                    let currentTotal = counts.reduce((sum, c) => sum + c.exactCount, 0);
                    let remainder = participantsCount - currentTotal;
                    counts.sort((a, b) => b.fraction - a.fraction);
                    for(let i = 0; i < remainder; i++) {
                        counts[i % counts.length].exactCount++;
                    }
                    
                    /* Populate array with exact counts */
                    counts.forEach(c => {
                        for(let i = 0; i < c.exactCount; i++) {
                            distribution.push(c.name);
                        }
                    });
                    
                    /* Shuffle the answers for realism */
                    for (let i = distribution.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
                    }
                    
                    return distribution;
                });

                /* Build rows for each participant */
                for (let i = 0; i < participantsCount; i++) {
                    const row = [];
                    const date = new Date(Date.now() - Math.floor(Math.random() * 7 * 24 * 60 * 60 * 1000));
                    row.push(date.toLocaleString('en-GB'));
                    
                    /* Grab the pre-calculated, shuffled answer for this specific row */
                    itemColumns.forEach(column => {
                        row.push(column[i]);
                    });
                    data.push(row);
                }

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Form Responses 1");
                XLSX.writeFile(wb, "Google_Forms_Mock_Results.xlsx");
            };

            return (
                <div className="max-w-screen-2xl mx-auto p-6 font-sans">
                    {/* --- Custom Modal Overlay --- */}
                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 transition-opacity duration-300">
                            <div className="bg-white p-8 rounded-xl shadow-2xl max-w-lg w-full text-center border-t-8 border-red-500 transform scale-100 transition-transform duration-300">
                                <h3 className="text-3xl font-bold mb-4 text-gray-800">
                                    {modalConfig.type === 'alert' ? 'تنبيه' : 'تأكيد الإجراء'}
                                </h3>
                                <p className="text-2xl text-gray-600 mb-8 font-light leading-relaxed">{modalConfig.message}</p>
                                <div className="flex justify-center gap-4">
                                    {modalConfig.type === 'confirm' && (
                                        <button 
                                            onClick={() => { modalConfig.onConfirm(); closeModal(); }}
                                            className="bg-red-500 text-white px-8 py-3 rounded-xl text-xl hover:scale-105 transition-transform duration-200 shadow-md font-bold uppercase"
                                        >
                                            <i className="fas fa-check mr-2"></i> نعم، متأكد
                                        </button>
                                    )}
                                    <button 
                                        onClick={closeModal}
                                        className="bg-gray-300 text-gray-800 px-8 py-3 rounded-xl text-xl hover:scale-105 transition-transform duration-200 shadow-md font-bold uppercase"
                                    >
                                        <i className="fas fa-times mr-2"></i> {modalConfig.type === 'confirm' ? 'إلغاء' : 'حسناً'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation & Logos */}
                    <div className="flex justify-between items-center mb-8 bg-white p-4 rounded-3xl shadow-lg hover-zoom border-t-4 border-blue-500">
                        {/* Right Logo (00.png) - since dir="rtl", this is first in the DOM */}
                        <img src="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/00.png" alt="Logo Right" className="h-16 md:h-20 w-auto object-contain drop-shadow-md" />
                        
                        {/* Home Button */}
                        <a href="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/" className="bg-blue-600 text-white px-6 py-3 rounded-2xl text-xl md:text-2xl hover:bg-blue-700 hover:scale-105 transition-all duration-200 shadow-xl flex items-center gap-3 font-black">
                            <i className="fas fa-home"></i> الرئيسية (Home)
                        </a>

                        {/* Left Logo (02.jpg) */}
                        <img src="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/02.jpg" alt="Logo Left" className="h-16 md:h-20 w-auto object-contain rounded-xl shadow-sm" />
                    </div>

                    {/* Header */}
                    <div className="text-center mb-10">
                        <h1 className="text-6xl thin-title text-blue-900 mb-2 font-black">Questionnaire Designer</h1>
                        <p className="text-2xl thin-title text-blue-700 font-bold">Design Sub-items, Columns, and Percentages Dynamically</p>
                    </div>

                    {/* Advanced Tools Section (Upload & Auto Fill) */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg mb-8 border-t-4 border-green-500 hover-zoom">
                        <div className="flex flex-wrap justify-center gap-4">
                            <button 
                                onClick={exportEmptyTemplate}
                                className="bg-green-500 text-white px-8 py-5 rounded-2xl text-2xl hover:scale-105 transition-all duration-200 shadow-xl flex items-center justify-center gap-3 font-black"
                            >
                                <i className="fas fa-file-download"></i> تحميل قالب فارغ
                            </button>
                            <button 
                                onClick={handleAutoFill}
                                className="bg-green-500 text-white px-8 py-5 rounded-2xl text-2xl hover:scale-105 transition-all duration-200 shadow-xl flex items-center justify-center gap-3 font-black"
                            >
                                <i className="fas fa-magic"></i> تعبئة تلقائية (Auto Fill)
                            </button>
                            <label className="bg-green-500 text-white px-8 py-5 rounded-2xl text-2xl hover:scale-105 transition-all duration-200 shadow-xl cursor-pointer flex items-center justify-center gap-3 m-0 font-black">
                                <i className="fas fa-upload"></i> رفع قالب (Upload Excel)
                                <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
                            </label>
                        </div>
                    </div>

                    {/* Participants Count */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg mb-8 border-t-4 border-purple-500 flex flex-col items-center hover-zoom">
                        <h2 className="text-3xl thin-title text-gray-800 mb-4 font-black">عدد المشاركين (Number of Participants)</h2>
                        <p className="text-gray-600 mb-4 text-center font-bold">أدخل عدد المشاركين المطلوب لإنشاء نتائج وهمية تحاكي Google Forms (يفضل 100 لنسب مطابقة).</p>
                        <div className="flex items-center gap-4">
                            <i className="fas fa-users text-4xl text-purple-500"></i>
                            <input 
                                type="number" 
                                min="1"
                                value={participantsCount}
                                onChange={(e) => setParticipantsCount(Math.max(1, Number(e.target.value)))}
                                className="w-32 p-4 border border-gray-300 rounded-xl text-3xl text-center focus:outline-none focus:border-purple-500 font-black text-indigo-800"
                            />
                        </div>
                    </div>

                    {/* Scale Columns Manager (Global) */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg mb-8 hover-zoom">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl thin-title text-gray-800 font-black">إدارة الأعمدة / المقاييس (Columns Management)</h2>
                            <button 
                                onClick={addScale}
                                className="bg-green-500 text-white px-6 py-4 rounded-xl text-xl hover:scale-105 transition-all duration-200 shadow-md flex items-center gap-2 font-bold"
                            >
                                <i className="fas fa-columns"></i> إضافة عمود (مقياس)
                            </button>
                        </div>
                        <div className="flex flex-wrap gap-4">
                            {scales.map((scale, index) => {
                                const isDraggedOver = draggedOverScaleIndex === index;
                                return (
                                    <div 
                                        key={scale.id} 
                                        draggable
                                        onDragStart={(e) => handleScaleDragStart(e, index)}
                                        onDragOver={(e) => handleScaleDragOver(e, index)}
                                        onDrop={(e) => handleScaleDrop(e, index)}
                                        onDragEnd={handleScaleDragEnd}
                                        className={`flex flex-col sm:flex-row items-center gap-2 bg-blue-50 border-2 p-3 rounded-2xl shadow-sm cursor-move transition-all hover:shadow-md
                                            ${isDraggedOver ? 'border-dashed border-blue-500 bg-blue-100 scale-105' : 'border-blue-200'}
                                        `}
                                        title="اسحب لتغيير الترتيب"
                                    >
                                        <i className="fas fa-grip-vertical text-gray-400 px-2 cursor-move hover:text-blue-500"></i>
                                        <input 
                                            type="text" 
                                            value={scale.name}
                                            onChange={(e) => updateScaleName(scale.id, e.target.value)}
                                            className="p-3 border border-gray-300 rounded-xl text-xl focus:outline-none focus:border-blue-500 w-40 text-center font-bold"
                                            placeholder="اسم العمود"
                                        />
                                        <select
                                            value={scale.type || 'neutral'}
                                            onChange={(e) => updateScaleType(scale.id, e.target.value)}
                                            className={`p-3 border border-gray-300 rounded-xl text-lg focus:outline-none focus:border-blue-500 font-black cursor-pointer
                                                ${scale.type === 'positive' ? 'text-green-700 bg-green-100' : 
                                                  scale.type === 'negative' ? 'text-red-700 bg-red-100' : 
                                                  'text-gray-700 bg-gray-100'}`}
                                        >
                                            <option value="positive">إيجابي (+)</option>
                                            <option value="neutral">محايد (0)</option>
                                            <option value="negative">سلبي (-)</option>
                                        </select>
                                        {scales.length > 1 && (
                                            <button onClick={() => removeScale(scale.id)} className="text-red-500 hover:text-red-700 px-3 text-3xl hover:scale-110 transition-transform" title="حذف العمود">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Domains & Grid Layout */}
                    <div className="mb-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-4xl thin-title text-gray-800 font-black">المجالات والبنود (Domains & Item Matrix)</h2>
                            <button 
                                onClick={addDomain}
                                className="bg-green-500 text-white px-8 py-5 rounded-2xl text-2xl hover:scale-105 transition-all duration-200 shadow-xl flex items-center gap-2 font-black"
                            >
                                <i className="fas fa-folder-plus"></i> إضافة مجال جديد
                            </button>
                        </div>
                        
                        {domains.length === 0 && (
                            <div className="bg-white p-12 rounded-3xl shadow-xl border-t-4 border-gray-300 text-center hover-zoom">
                                <i className="fas fa-folder-open text-6xl text-gray-300 mb-4"></i>
                                <h3 className="text-3xl text-gray-500 font-black">لا توجد مجالات لعرضها حالياً</h3>
                                <p className="text-gray-400 mt-2 text-xl font-bold">قم بإضافة مجال جديد أو رفع ملف قالب Excel للبدء.</p>
                            </div>
                        )}

                        {domains.map(domain => (
                            <div 
                                key={domain.id} 
                                className="bg-white p-8 rounded-3xl shadow-xl mb-10 border-r-8 border-blue-500 hover-zoom"
                                onDragOver={(e) => {
                                    if(domain.items.length === 0) handleDragOver(e, domain.id, 0);
                                }}
                                onDrop={(e) => {
                                    if(domain.items.length === 0) handleDrop(e, domain.id, 0);
                                }}
                            >
                                {/* Domain Header */}
                                <div className="flex flex-col lg:flex-row gap-4 mb-8 pb-6 border-b-2 border-gray-100">
                                    <div className="flex-1">
                                        <label className="block text-indigo-800 mb-2 text-sm font-black uppercase tracking-widest">اسم المجال</label>
                                        <input 
                                            type="text" 
                                            value={domain.name}
                                            onChange={(e) => updateDomain(domain.id, 'name', e.target.value)}
                                            className="w-full p-4 border-2 border-gray-200 rounded-2xl text-3xl font-black focus:outline-none focus:border-blue-500 bg-blue-50"
                                            placeholder="أدخل اسم المجال"
                                        />
                                    </div>
                                    <div className="flex items-end pb-1">
                                        <button 
                                            onClick={() => removeDomain(domain.id)}
                                            className="bg-red-500 text-white px-8 py-5 rounded-2xl text-2xl hover:scale-105 transition-all duration-200 shadow-md font-bold"
                                            title="حذف المجال بالكامل"
                                        >
                                            <i className="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>

                                {/* Items Grid/Table Structure */}
                                <div className="w-full overflow-x-auto">
                                    <div className="min-w-[950px]">
                                        {/* Table Header (Matching the Analyzer completely) */}
                                        <div className="flex bg-slate-100 p-4 rounded-t-2xl font-black text-gray-700 border-2 border-gray-200">
                                            <div className="w-12"></div>
                                            <div className="flex-1 px-4 text-xl">البنود (Sub-items)</div>
                                            {scales.map(scale => (
                                                <div key={scale.id} className={`w-28 text-center px-1 text-lg flex flex-col items-center justify-center
                                                    ${scale.type === 'positive' ? 'text-green-700' : 
                                                      scale.type === 'negative' ? 'text-red-700' : 
                                                      'text-gray-600'}`}
                                                >
                                                    <span className="font-black">{scale.name}</span>
                                                    {scale.type === 'positive' && <i className="fas fa-plus text-sm mt-1"></i>}
                                                    {scale.type === 'negative' && <i className="fas fa-minus text-sm mt-1"></i>}
                                                    {scale.type === 'neutral' && <i className="fas fa-circle text-[10px] mt-1 opacity-50"></i>}
                                                </div>
                                            ))}
                                            <div className="w-32 text-center px-2 font-black text-xl text-blue-800">إجمالي الصف (%)</div>
                                            <div className="w-32 text-center px-2 font-black text-xl text-green-700">إيجابيات (%)</div>
                                            <div className="w-16 text-center"></div>
                                        </div>

                                        {/* Items Rows */}
                                        <div className="border-x-2 border-b-2 border-gray-200 rounded-b-2xl pb-3 bg-gray-50 space-y-2 p-3">
                                            {domain.items.map((item, iIndex) => {
                                                const isDraggedOver = draggedOverItem && draggedOverItem.domainId === domain.id && draggedOverItem.itemIndex === iIndex;
                                                const rowTotal = getItemRowTotal(item.values);
                                                const posTotal = getPositivesTotal(item.values);
                                                const isRowValid = Math.abs(rowTotal - 100) < 0.1; /* Allows safe floating point evaluation */

                                                return (
                                                    <div 
                                                        key={item.id}
                                                        draggable
                                                        onDragStart={(e) => handleDragStart(e, domain.id, iIndex)}
                                                        onDragOver={(e) => handleDragOver(e, domain.id, iIndex)}
                                                        onDrop={(e) => handleDrop(e, domain.id, iIndex)}
                                                        onDragEnd={handleDragEnd}
                                                        className={`flex items-center gap-2 p-3 rounded-2xl bg-white border border-gray-200 shadow-sm transition-all cursor-move hover:shadow-md
                                                            ${isDraggedOver ? 'border-dashed border-2 border-blue-400 bg-blue-50' : ''}
                                                        `}
                                                    >
                                                        {/* Drag Handle */}
                                                        <div className="w-12 flex justify-center text-gray-400 hover:text-indigo-600 transition-colors">
                                                            <i className="fas fa-grip-vertical text-2xl"></i>
                                                        </div>
                                                        
                                                        {/* Item Text Input */}
                                                        <div className="flex-1 px-1">
                                                            <input 
                                                                type="text" 
                                                                value={item.text}
                                                                onChange={(e) => updateItemText(domain.id, item.id, e.target.value)}
                                                                className="w-full p-4 border border-gray-300 rounded-xl text-xl font-bold focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                                                                placeholder="أدخل نص البند..."
                                                            />
                                                        </div>

                                                        {/* Percentage Cells for each Scale */}
                                                        {scales.map(scale => (
                                                            <div key={`cell-${scale.id}`} className="w-28 px-1 flex items-center justify-center relative">
                                                                <input 
                                                                    type="number" 
                                                                    value={item.values[scale.id] !== undefined ? item.values[scale.id] : ''}
                                                                    onChange={(e) => updateItemValue(domain.id, item.id, scale.id, e.target.value)}
                                                                    className={`w-full p-4 pr-8 border rounded-xl text-center text-xl focus:outline-none focus:ring-2 font-black transition-colors
                                                                        ${scale.type === 'positive' ? 'border-green-200 focus:border-green-500 focus:ring-green-200 bg-green-50 text-green-800' : 
                                                                          scale.type === 'negative' ? 'border-red-200 focus:border-red-500 focus:ring-red-200 bg-red-50 text-red-800' : 
                                                                          'border-gray-300 focus:border-blue-500 focus:ring-blue-200 bg-white text-gray-800'}`}
                                                                />
                                                                <span className="absolute right-4 text-gray-400 font-bold pointer-events-none">%</span>
                                                            </div>
                                                        ))}

                                                        {/* Row Total Calculator */}
                                                        <div className="w-32 flex items-center justify-center">
                                                            <div className={`w-full text-center font-black text-2xl px-2 py-3 rounded-xl transition-colors ${isRowValid ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                                                                {rowTotal.toFixed(1)}%
                                                            </div>
                                                        </div>

                                                        {/* Positives Total Calculator (Like Analyzer) */}
                                                        <div className="w-32 flex items-center justify-center">
                                                            <div className={`w-full text-center font-black text-2xl px-2 py-3 rounded-xl transition-colors bg-green-100 text-green-700`}>
                                                                {posTotal.toFixed(1)}%
                                                            </div>
                                                        </div>

                                                        {/* Delete Row Action */}
                                                        <div className="w-16 flex justify-center">
                                                            <button 
                                                                onClick={() => removeItem(domain.id, item.id)}
                                                                className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 w-12 h-12 rounded-full transition-all flex items-center justify-center hover:scale-110 shadow-sm"
                                                                title="حذف البند"
                                                            >
                                                                <i className="fas fa-times text-2xl"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => addItem(domain.id)}
                                    className="mt-8 bg-green-500 text-white px-8 py-4 rounded-2xl text-xl hover:scale-105 transition-all duration-200 shadow-md flex items-center gap-2 font-bold"
                                >
                                    <i className="fas fa-plus-circle"></i> إضافة بند جديد للمجال
                                </button>
                            </div>
                        ))}
                    </div>

                    {/* Export Actions Section */}
                    <div className="bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-green-500 text-center mb-10 hover-zoom">
                        <h2 className="text-4xl thin-title text-gray-800 mb-10 font-black">خيارات التصدير (Export Options)</h2>
                        <div className="flex flex-col md:flex-row justify-center gap-8">
                            <button 
                                onClick={exportTemplate}
                                className="bg-green-500 text-white px-10 py-6 rounded-2xl text-3xl hover:scale-105 transition-all duration-200 shadow-xl flex items-center justify-center gap-4 w-full md:w-auto font-black"
                            >
                                <i className="fas fa-file-excel"></i> تحميل بيانات التقييم (Template)
                            </button>
                            <button 
                                onClick={exportGoogleFormsMock}
                                className="bg-green-500 text-white px-10 py-6 rounded-2xl text-3xl hover:scale-105 transition-all duration-200 shadow-xl flex items-center justify-center gap-4 w-full md:w-auto font-black"
                            >
                                <i className="fas fa-chart-pie"></i> إنشاء نتائج وهمية (Google Forms)
                            </button>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
